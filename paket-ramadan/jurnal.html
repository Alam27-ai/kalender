<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Jurnal Ramadan Langit Cilik</title>
<style>
  @font-face { font-family:"Baloo 2"; font-weight:600; src:url(font/Baloo2-600.ttf); }
  @font-face { font-family:"Baloo 2"; font-weight:800; src:url(font/Baloo2-800.ttf); }
  @font-face { font-family:Nunito; font-weight:400; src:url(font/Nunito-400.ttf); }
  @font-face { font-family:Nunito; font-weight:700; src:url(font/Nunito-700.ttf); }
  @font-face { font-family:Nunito; font-weight:800; src:url(font/Nunito-800.ttf); }
  @page { size:A4; margin:0; }
  :root { --biru:#141a45; --biru2:#3a4290; --emas:#f2b705; --krem:#fff6d6; --lembut:#eef0ff; --garis:#c9cdf0;
          --terang:#ffe680; --gelap:#d9dcf5; }
  * { box-sizing:border-box; }
  body { margin:0; background:#888; font-family:Nunito, sans-serif; color:var(--biru); }
  .hal { width:210mm; height:297mm; padding:14mm 14mm 12mm; background:#fff; position:relative; overflow:hidden;
         page-break-after:always; display:flex; flex-direction:column; margin:0 auto 8mm; }
  @media print { body { background:#fff; } .hal { margin:0; } }
  h1, h2, h3 { font-family:"Baloo 2", sans-serif; margin:0; line-height:1.1; }
  h2 { font-size:26pt; font-weight:800; }
  h3 { font-size:14pt; font-weight:800; margin-bottom:2mm; }
  p { margin:0 0 3mm; font-size:11.5pt; line-height:1.5; }
  .kaki { position:absolute; left:14mm; right:14mm; bottom:7mm; display:flex; justify-content:space-between;
          font-size:8.5pt; color:var(--biru2); }
  .pita { display:inline-block; background:var(--emas); color:var(--biru); font-weight:800; border-radius:99px;
          padding:1mm 5mm; font-size:11pt; margin-bottom:3mm; }
  .kotak { border:0.6mm solid var(--garis); border-radius:5mm; padding:4mm 5mm; margin-bottom:4mm; }
  .krem { background:var(--krem); border-color:#f3dc8a; }
  .lembut { background:var(--lembut); border-color:var(--garis); }
  .garis { border-bottom:0.4mm dashed var(--garis); height:8.5mm; }
  .cek { display:inline-flex; align-items:center; gap:2mm; margin-right:5mm; font-weight:700; font-size:11pt; }
  .cek::before { content:""; width:5.5mm; height:5.5mm; border:0.6mm solid var(--biru2); border-radius:1.5mm; }
  .bulat::before { border-radius:50%; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:4mm; }
  svg.bulan circle.dasar { fill:var(--gelap); }
  svg.bulan path { fill:var(--terang); }
  svg.kosong circle { fill:none; stroke:var(--biru2); stroke-width:3; stroke-dasharray:6 5; }

  /* Sampul */
  .sampul { background:var(--biru); color:#fff; align-items:center; text-align:center; justify-content:center; }
  .sampul h1 { font-size:54pt; font-weight:800; color:var(--terang); margin-top:8mm; }
  .sampul .anak { font-size:20pt; font-family:"Baloo 2"; font-weight:600; margin-top:2mm; }
  .sampul .milik { margin-top:14mm; font-size:15pt; border-bottom:0.6mm dashed #fff; width:120mm; padding-bottom:2mm; }
  .sampul .bintang { position:absolute; background:#fff; border-radius:50%; }
  .sampul .merek { position:absolute; bottom:12mm; font-size:11pt; color:#c9cdf0; }

  /* Peta 30 hari */
  .peta { display:grid; grid-template-columns:repeat(5, 1fr); gap:3mm; flex:1; }
  .peta div { border:0.6mm solid var(--garis); border-radius:4mm; display:flex; flex-direction:column;
              align-items:center; justify-content:center; gap:1mm; font-weight:800; font-size:13pt; position:relative; }
  .peta div.ganjil { background:var(--krem); border-color:var(--emas); }
  .peta div.ganjil::after { content:"★"; position:absolute; top:1mm; right:2.5mm; color:var(--emas); font-size:12pt; }
  .peta .kecil { width:6mm; height:6mm; border:0.5mm solid var(--biru2); border-radius:1.2mm; }

  /* Pengamatan bulan */
  .amat { display:grid; grid-template-columns:repeat(6, 1fr); gap:2mm 3mm; }
  .amat div { text-align:center; font-weight:800; font-size:10pt; }

  /* Harian */
  .atas { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4mm; }
  .atas .hari { font-size:34pt; }
  .tanggal { font-size:11pt; font-weight:700; margin-top:2mm; }
  .bulanmalam { display:flex; gap:4mm; text-align:center; font-size:8.5pt; font-weight:700; }
  .salat { display:flex; flex-wrap:wrap; gap:2mm 0; }
  .rasa { display:flex; gap:7mm; font-size:11pt; font-weight:700; align-items:center; }
  .rasa span { font-size:20pt; }
  .fakta { background:var(--biru); color:#fff; border-radius:5mm; padding:4mm 5mm; font-size:11pt; }
  .fakta b { color:var(--terang); }

  /* Teka-teki */
  table.huruf { border-collapse:collapse; margin:3mm auto 6mm; }
  table.huruf td { width:12.5mm; height:12.5mm; text-align:center; font-family:"Baloo 2"; font-weight:800; font-size:17pt;
                   border:0.4mm solid var(--garis); }
  table.kunci td { width:5.5mm; height:5.5mm; font-size:8pt; }
  table.kunci td.ya { background:var(--terang); }
  .daftar { display:grid; grid-template-columns:repeat(4, 1fr); gap:2mm; font-weight:800; font-size:12pt; }
  .daftar span::before { content:"☐ "; color:var(--biru2); }

  /* Lencana */
  .lencana { display:grid; grid-template-columns:repeat(4, 1fr); gap:6mm 4mm; flex:1; align-content:center; }
  .lencana div { aspect-ratio:1; border:0.8mm dashed var(--biru2); border-radius:50%; display:flex; flex-direction:column;
                 align-items:center; justify-content:center; text-align:center; padding:4mm; background:var(--krem);
                 font-family:"Baloo 2"; font-weight:800; font-size:12pt; line-height:1.05; }
  .lencana div span { font-size:22pt; }

  /* Sertifikat */
  .sertif { border:3mm double var(--emas); border-radius:6mm; flex:1; display:flex; flex-direction:column; align-items:center;
            justify-content:center; text-align:center; padding:10mm; }
  .sertif h2 { font-size:34pt; }
  .sertif .nama { font-family:"Baloo 2"; font-weight:800; font-size:30pt; border-bottom:0.6mm dashed var(--biru2);
                  min-width:130mm; min-height:16mm; margin:6mm 0; }
  .ttd { display:flex; gap:30mm; margin-top:16mm; font-weight:700; }
  .ttd div { border-top:0.5mm solid var(--biru); width:50mm; padding-top:2mm; }
</style>
</head>
<body>
<div id="buku"></div>
<script>
// Pakai ?nama=Aisyah untuk versi personal, ?tahun=1449 untuk tahun lain.
const q = new URLSearchParams(location.search);
const NAMA = (q.get("nama") || "").slice(0, 24), TAHUN = +q.get("tahun") || 1448;
const MEREK = "Langit Cilik";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Sama dengan bulan.html: bagian terang bulan menurut umur bulan (hari sejak bulan baru).
const SINODIS = 29.530588853;
function pathTerang(umur, cx, cy, r) {
  const t = 2 * Math.PI * umur / SINODIS, rx = Math.abs(r * Math.cos(t)), naik = umur < SINODIS / 2;
  const sabit = Math.cos(t) > 0;
  return `M ${cx} ${cy - r} A ${r} ${r} 0 0 ${naik ? 1 : 0} ${cx} ${cy + r} ` +
         `A ${rx} ${r} 0 0 ${naik === sabit ? 0 : 1} ${cx} ${cy - r} Z`;
}
const bulan = (umur, mm) => `<svg class="bulan" viewBox="0 0 200 200" style="width:${mm}mm;height:${mm}mm">` +
  `<circle class="dasar" cx="100" cy="100" r="92"/><path d="${pathTerang(umur, 100, 100, 92)}"/></svg>`;
const kosong = mm => `<svg class="kosong" viewBox="0 0 200 200" style="width:${mm}mm;height:${mm}mm"><circle cx="100" cy="100" r="90"/></svg>`;
// Sore hari ke-N Ramadan, umur bulan kira-kira N + 0,5 hari.
const umurHari = n => n + 0.5;

let nomor = 0;
const hal = (isi, kelas = "") => `<section class="hal ${kelas}">${isi}` +
  (kelas.includes("sampul") ? "" : `<div class="kaki"><span>Jurnal Ramadan ${TAHUN} H · ${MEREK}</span><span>${++nomor}</span></div>`) +
  `</section>`;
const garis = n => '<div class="garis"></div>'.repeat(n);

const FAKTA = [
  "Bulan butuh sekitar <b>29,5 hari</b> untuk kembali ke bentuk yang sama.",
  "Cahaya bulan sebenarnya adalah <b>pantulan cahaya Matahari</b>.",
  "Jarak Bumi ke Bulan sekitar <b>384.000 km</b>. Naik mobil tanpa berhenti butuh lebih dari 5 bulan!",
  "<b>Hilal</b> adalah sabit tipis pertama yang terlihat setelah bulan baru.",
  "Bulan selalu menghadapkan <b>sisi yang sama</b> ke Bumi.",
  "Kalender Hijriah punya <b>12 bulan</b>, masing-masing 29 atau 30 hari.",
  "Ramadan adalah <b>bulan ke-9</b> dalam kalender Hijriah.",
  "Saat <b>purnama</b>, bulan terbit di timur ketika Matahari terbenam di barat.",
  "Gravitasi di Bulan hanya sekitar <b>1/6</b> gravitasi Bumi. Lompatanmu bisa 6 kali lebih tinggi!",
  "Saat <b>bulan baru</b>, sisi terang bulan membelakangi Bumi, jadi bulan tidak terlihat.",
  "Pasang surut air laut terutama disebabkan oleh <b>tarikan gravitasi Bulan</b>.",
  "Manusia pertama kali mendarat di Bulan pada tahun <b>1969</b>.",
  "Lebar Bulan kira-kira <b>seperempat</b> lebar Bumi.",
  "Bulan sabit di akhir bulan Hijriah terlihat di <b>timur menjelang subuh</b>.",
  "<b>Zakat fitrah</b> dibayarkan sebelum salat Idulfitri.",
];

const buku = [];

// 1. Sampul
let bintang = "";
for (let i = 0; i < 40; i++) {
  const x = (i * 37) % 100, y = (i * 53) % 100, s = 0.6 + (i % 3) * 0.5;
  if (y > 25 && y < 85 && x > 15 && x < 85) continue;
  bintang += `<i class="bintang" style="left:${x}%;top:${y}%;width:${s}mm;height:${s}mm;opacity:${0.4 + (i % 4) * 0.15}"></i>`;
}
buku.push(hal(`${bintang}
  ${bulan(4, 70)}
  <h1>Jurnal Ramadan</h1>
  <div class="anak">Catatan puasa & pengamat bulan cilik · ${TAHUN} H</div>
  <div class="milik">Milik: <b>${esc(NAMA)}</b></div>
  <div class="merek">${MEREK}</div>`, "sampul"));

// 2. Untuk Ayah & Bunda
buku.push(hal(`<span class="pita">Untuk Ayah & Bunda</span>
  <h2>Cara memakai jurnal ini</h2><br>
  <div class="kotak lembut">
    <p><b>1. Satu halaman satu hari.</b> Isi bersama anak setelah berbuka atau sebelum tidur, cukup 5–10 menit.</p>
    <p><b>2. Isi tanggal Masehi sendiri.</b> Awal Ramadan mengikuti pengumuman pemerintah, jadi halaman ini memakai “hari ke-1, ke-2, …”.</p>
    <p><b>3. Ajak melihat bulan.</b> Di awal Ramadan, cari sabit tipis di langit barat setelah maghrib. Pertengahan bulan, purnama terbit di timur. Gambar yang terlihat di lembar pengamatan.</p>
    <p><b>4. Rayakan usaha, bukan hanya hasil.</b> Puasa setengah hari untuk anak kecil juga patut dirayakan. Gunting lencana di halaman belakang sebagai hadiah.</p>
    <p style="margin:0"><b>5. Di akhir Ramadan</b>, isi sertifikat dan tanda tangani bersama.</p>
  </div>
  <div class="kotak krem">
    <h3>Isi buku ini</h3>
    <p style="margin:0">Target Ramadanku · Peta 30 hari · Lembar pengamatan bulan · 30 halaman harian ·
      Teka-teki kata · Lencana amal baik · Sertifikat</p>
  </div>
  <div class="kotak lembut"><h3>Ide kegiatan seru bersama</h3>
    <p>🍲 Membuat takjil bersama lalu membaginya ke tetangga.</p>
    <p>🔭 “Berburu hilal” di sore pertama Ramadan dan menjelang Lebaran.</p>
    <p>🪙 Membuat celengan sedekah dari kaleng bekas, dibuka di akhir Ramadan.</p>
    <p style="margin:0">⭐ Menghias kamar dengan bulan dan bintang dari kertas untuk 10 malam terakhir.</p>
  </div>
  <p style="font-size:10pt">Bentuk bulan di setiap halaman adalah perkiraan, bisa beda sedikit dengan yang terlihat di langit.
    Justru itu serunya: bandingkan dengan pengamatan sendiri!</p>`));

// 3. Target
buku.push(hal(`<span class="pita">Bismillah</span><h2>Target Ramadanku</h2><br>
  <div class="grid2">
    <div class="kotak krem"><h3>🌙 Puasa</h3><p>Aku mau berpuasa penuh ______ hari.</p></div>
    <div class="kotak krem"><h3>📖 Mengaji</h3><p>Aku mau membaca ______ halaman / juz.</p></div>
    <div class="kotak krem"><h3>🤲 Sedekah</h3><p>Aku mau bersedekah kepada:</p>${garis(1)}</div>
    <div class="kotak krem"><h3>⭐ Kebiasaan baru</h3><p>Kebiasaan baik yang mau aku mulai:</p>${garis(1)}</div>
  </div>
  <div class="kotak lembut"><h3>Hafalan surat atau doa yang ingin aku kuasai</h3>${garis(5)}</div>
  <div class="kotak lembut"><h3>Setelah Ramadan, aku ingin menjadi anak yang…</h3>${garis(5)}</div>
  <div class="kotak krem" style="flex:1"><h3>🖍️ Gambar suasana Lebaran impianku</h3></div>`));

// 4. Peta 30 hari
buku.push(hal(`<span class="pita">Peta Puasaku</span><h2>30 Hari Ramadan</h2>
  <p>Centang kotak setiap hari kamu berpuasa. Kotak ★ adalah malam ganjil di 10 malam terakhir.</p>
  <div class="peta">${Array.from({ length: 30 }, (_, i) => {
    const n = i + 1;
    return `<div class="${n >= 21 && n % 2 ? "ganjil" : ""}">${bulan(umurHari(n), 11)}<span>${n}</span><i class="kecil"></i></div>`;
  }).join("")}</div>`));

// 5. Pengamatan bulan
buku.push(hal(`<span class="pita">Pengamat Bulan Cilik</span><h2>Bulan yang Aku Lihat</h2>
  <p>Setiap malam, lihat bulan lalu arsir bagian yang gelap. Kalau mendung, tulis “awan”.</p>
  <div class="kotak lembut" style="font-size:10.5pt">
    <b>Awal Ramadan:</b> sabit tipis di <b>barat</b> setelah maghrib. ·
    <b>Pertengahan:</b> purnama terbit di <b>timur</b>. ·
    <b>Akhir Ramadan:</b> bulan terbit larut malam, coba lihat menjelang subuh.
  </div>
  <div class="amat">${Array.from({ length: 30 }, (_, i) => `<div>${kosong(25)}<br>${i + 1}</div>`).join("")}</div>`));

// 6. Halaman harian
for (let n = 1; n <= 30; n++) {
  buku.push(hal(`<div class="atas">
      <div><span class="pita">Ramadan</span><h2 class="hari">Hari ke-${n}</h2>
        <div class="tanggal">Tanggal: ______ / ______ / ________</div></div>
      <div class="bulanmalam"><div>${bulan(umurHari(n), 24)}<br>Perkiraan</div><div>${kosong(24)}<br>Yang aku lihat</div></div>
    </div>
    <div class="kotak krem"><h3>Puasaku hari ini</h3>
      <span class="cek bulat">Penuh</span><span class="cek bulat">Setengah hari</span><span class="cek bulat">Sedang belajar</span>
      <div class="grid2" style="margin-top:3mm"><div>Menu sahur: ____________________</div><div>Menu buka: ____________________</div></div>
    </div>
    <div class="kotak lembut"><h3>Salatku</h3><div class="salat">
      ${["Subuh", "Zuhur", "Asar", "Magrib", "Isya", "Tarawih"].map(s => `<span class="cek">${s}</span>`).join("")}</div></div>
    <div class="grid2">
      <div class="kotak"><h3>📖 Mengaji</h3><p style="margin:0">Surat / halaman:</p>${garis(1)}</div>
      <div class="kotak"><h3>🤲 Amal baikku</h3>${garis(2)}</div>
    </div>
    <div class="kotak"><h3>Hari ini aku bersyukur karena…</h3>${garis(2)}</div>
    <div class="kotak" style="flex:1;margin-bottom:4mm"><h3>✏️ Gambar atau ceritakan hari ini</h3></div>
    <div class="kotak rasa" style="margin-bottom:4mm"><b>Perasaanku:</b> <span>☀️</span>cerah <span>⛅</span>biasa <span>🌧️</span>mendung</div>
    <div class="fakta">🌙 <b>Tahukah kamu?</b> ${FAKTA[(n - 1) % FAKTA.length]}</div>`));
}

// 7. Teka-teki kata (cari kata), acak tetap supaya hasilnya sama setiap dicetak
const KATA = ["PUASA", "SAHUR", "HILAL", "BULAN", "ZAKAT", "TARAWIH", "SEDEKAH", "PURNAMA", "TAKJIL", "LEBARAN", "MASJID", "IFTAR"];
const UK = 12, ARAH = [[0, 1], [1, 0], [1, 1]];
let biji = 1448;
const acak = () => ((biji = (biji * 1103515245 + 12345) % 2147483648) / 2147483648);
let papan, kunci;
do {
  papan = Array.from({ length: UK }, () => Array(UK).fill(""));
  kunci = Array.from({ length: UK }, () => Array(UK).fill(false));
  var ok = KATA.every(k => {
    for (let coba = 0; coba < 300; coba++) {
      const [dr, dc] = ARAH[Math.floor(acak() * 3)];
      const r = Math.floor(acak() * (UK - dr * (k.length - 1))), c = Math.floor(acak() * (UK - dc * (k.length - 1)));
      if ([...k].every((h, i) => [h, ""].includes(papan[r + dr * i][c + dc * i]))) {
        [...k].forEach((h, i) => { papan[r + dr * i][c + dc * i] = h; kunci[r + dr * i][c + dc * i] = true; });
        return true;
      }
    }
    return false;
  });
} while (!ok);
const ABJAD = "ABCDEFGHIJKLMNOPRSTUWY";
papan = papan.map(b => b.map(h => h || ABJAD[Math.floor(acak() * ABJAD.length)]));
const tabel = (kelas, isi) => `<table class="huruf ${kelas}">${papan.map((b, r) =>
  `<tr>${b.map((h, c) => isi(h, r, c)).join("")}</tr>`).join("")}</table>`;
buku.push(hal(`<span class="pita">Teka-teki</span><h2>Cari Kata Ramadan</h2>
  <p>Kata-kata bersembunyi mendatar, menurun, dan miring. Lingkari setiap kata yang kamu temukan!</p>
  ${tabel("", h => `<td>${h}</td>`)}
  <div class="daftar">${KATA.map(k => `<span>${k}</span>`).join("")}</div>`));

// 8. Lencana
const LENCANA = [["🌙", "Puasa Penuh"], ["⏰", "Bangun Sahur"], ["🕌", "Rajin Tarawih"], ["🤲", "Suka Sedekah"],
  ["🏠", "Bantu Ibu"], ["🧰", "Bantu Ayah"], ["📖", "Rajin Mengaji"], ["💛", "Anak Sabar"], ["✅", "Anak Jujur"],
  ["🍲", "Berbagi Takjil"], ["🔭", "Pengamat Bulan"], ["⭐", "Malam Ganjil"]];
buku.push(hal(`<span class="pita">Hadiah</span><h2>Lencana Amal Baik</h2>
  <p>Ayah dan Bunda: gunting lencana dan berikan saat si kecil berhasil. Boleh diwarnai dulu!</p>
  <div class="lencana">${LENCANA.map(([i, t]) => `<div><span>${i}</span>${t}</div>`).join("")}</div>`));

// 9. Sertifikat
buku.push(hal(`<div class="sertif">
  ${bulan(5, 30)}
  <h2>Sertifikat Pejuang Ramadan</h2>
  <p style="font-size:14pt;margin-top:4mm">Dengan bangga diberikan kepada</p>
  <div class="nama">${esc(NAMA)}</div>
  <p style="font-size:14pt">yang telah berpuasa ______ hari di bulan Ramadan ${TAHUN} H<br>
    dan berusaha menjadi anak yang lebih baik setiap hari.</p>
  <div class="ttd"><div>Ayah</div><div>Bunda</div></div></div>`));

// 10. Kunci jawaban & hak cipta
buku.push(hal(`<h3>Kunci jawaban Cari Kata</h3>
  ${tabel("kunci", (h, r, c) => `<td class="${kunci[r][c] ? "ya" : ""}">${h}</td>`)}
  <div style="margin-top:auto" class="kotak lembut">
    <h3>Terima kasih sudah memakai Jurnal Ramadan ${MEREK}</h3>
    <p>Lihat bentuk bulan saat si kecil lahir dan main kuis langit di halaman “Bulan Saat Aku Lahir”.</p>
    <p style="margin:0;font-size:10pt">© ${MEREK}. Boleh dicetak berulang untuk keluarga sendiri.
      Mohon tidak dijual ulang atau dibagikan ke luar keluarga.</p>
  </div>`));

document.getElementById("buku").innerHTML = buku.join("");
</script>
</body>
</html>
